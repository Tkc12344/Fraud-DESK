name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: names
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        env:
          OWNER: ${{ steps.names.outputs.owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          publish() {
            docker buildx build --push \
              --cache-from "type=gha,scope=$1" \
              --cache-to "type=gha,scope=$1,mode=max" \
              -f "$2" \
              -t "ghcr.io/${OWNER}/fraud-desk-$1:${SHA}" \
              -t "ghcr.io/${OWNER}/fraud-desk-$1:latest" \
              .
          }
          publish scorer Dockerfile.scorer
          publish api server/Dockerfile
          publish web web/Dockerfile

  deploy:
    needs: publish
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-kubectl@v4

      - name: Deploy to the cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          OWNER: ${{ needs.publish.outputs.owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBECONFIG secret is not set, so the images were published and the cluster was left unchanged."
            exit 0
          fi
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          tag="ghcr.io/${OWNER}/fraud-desk"
          sed -i "s|fraud-desk-scorer:local|${tag}-scorer:${SHA}|" k8s/scorer.yaml
          sed -i "s|fraud-desk-api:local|${tag}-api:${SHA}|" k8s/api.yaml
          sed -i "s|fraud-desk-web:local|${tag}-web:${SHA}|" k8s/web.yaml
          sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Always|" k8s/*.yaml
          kubectl apply -k k8s
          kubectl -n fraud-desk rollout status deployment/scorer --timeout=180s
          kubectl -n fraud-desk rollout status statefulset/api --timeout=180s
          kubectl -n fraud-desk rollout status deployment/web --timeout=180s
