name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kubernetes manifests
        run: docker run --rm -v "$PWD/k8s:/k" registry.k8s.io/kustomize/kustomize:v5.6.0 build /k >/dev/null

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait until the desk is healthy
        run: node tests/e2e/wait.mjs

      - name: API end-to-end
        run: node --test tests/e2e/api.test.mjs

      - name: Browser end-to-end
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
